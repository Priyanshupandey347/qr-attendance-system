<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - QR Attendance</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
    color:white;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logout-btn{
    padding:8px 18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:white;
    color:#4e73df;
    font-weight:bold;
}

.container{
    padding:40px;
}

.welcome{
    margin-bottom:30px;
}

/* QR SCANNER SECTION */
.scanner-section{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:25px;
    border-radius:15px;
    text-align:center;
    margin-bottom:40px;
}

.scan-btn{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:white;
    color:#4e73df;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

#reader{
    margin-top:20px;
    width:100%;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
}

#scanResult{
    margin-top:15px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.card h3{
    font-size:28px;
    margin-top:10px;
}

.filter-section{
    text-align:right;
    margin-bottom:15px;
}

.filter-section select{
    padding:8px;
    border-radius:8px;
    border:none;
    color: #333;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse; 
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:10px;
}

th, td{
    padding:12px;
    text-align:center;
}

th{
    background:rgba(255,255,255,0.2);
}

tr:nth-child(even){
    background:rgba(255,255,255,0.1);
}

/* MOBILE */
@media(max-width:768px){
    .container{
        padding:20px;
    }
    .navbar{
        padding:15px 20px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🎓 QR Attendance - Student</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="welcome">
    <h2 id="welcomeText">Welcome, Student 👋</h2>
    <p>Track your attendance and filter records easily.</p>
</div>

<!-- QR SCANNER SECTION -->
<div class="scanner-section">
    <h3>Scan Attendance QR</h3>
    <button class="scan-btn" onclick="startScanner()">Scan</button>
    <div id="reader"></div>
    <div id="scanResult"></div>
</div>

<div class="cards">
    <div class="card">
        <p>Total Classes</p>
        <h3 id="totalClasses">0</h3>
    </div>

    <div class="card">
        <p>Present</p>
        <h3 id="presentCount">0</h3>
    </div>

    <div class="card">
        <p>Absent</p>
        <h3 id="absentCount">0</h3>
    </div>

    <div class="card">
        <p>Attendance %</p>
        <h3 id="attendancePercent">0%</h3>
    </div>
</div>

<div class="filter-section">
    <select id="filterOption" onchange="loadStudentAttendance()">
        <option value="all">All</option>
        <option value="present">Present Only</option>
        <option value="absent">Absent Only</option>
    </select>
</div>

<div class="table-container">
<table id="attendanceTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Subject</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="attendanceBody">
        <!-- Will be loaded from MongoDB -->
    </tbody>
</table>
</div>

</div>

<script>

let scanner;
let currentUser = null;

// On load, authenticate
window.onload = function() {
    const rawUser = localStorage.getItem('currentUser');
    if (!rawUser) {
        alert("Unauthorized! Please login first.");
        window.location.href = "login.html";
        return;
    }
    currentUser = JSON.parse(rawUser);
    document.getElementById("welcomeText").innerText = `Welcome, ${currentUser.fullName} 👋 (${currentUser.enrollment})`;

    loadStudentAttendance();
};

function logout(){
    localStorage.removeItem('currentUser');
    alert("Logged out successfully!");
    window.location.href="Home.html";
}

function startScanner(){
    if (!currentUser) return;

    document.getElementById("scanResult").innerText = "Starting camera...";
    scanner = new Html5Qrcode("reader");
    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decodedText)=>{
            document.getElementById("scanResult").innerText="QR Code read: " + decodedText;
            
            // Try to parse URL parameters: subject, session
            try {
                let subject = "General Class";
                let sessionID = "10000";

                if (decodedText.includes('?')) {
                    const urlParams = new URLSearchParams(decodedText.split('?')[1]);
                    if (urlParams.has('subject')) subject = urlParams.get('subject');
                    if (urlParams.has('session')) sessionID = urlParams.get('session');
                } else {
                    // Fallback to reading raw decoded text
                    subject = decodedText;
                }

                // Submit to MongoDB backend
                const response = await fetch('/api/attendance/mark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject,
                        sessionID,
                        enrollment: currentUser.enrollment,
                        studentName: currentUser.fullName,
                        year: currentUser.year
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    document.getElementById("scanResult").style.color = "#ffcccc";
                    document.getElementById("scanResult").innerText = "Failed: " + (result.error || "Could not mark attendance");
                } else {
                    document.getElementById("scanResult").style.color = "#00ffae";
                    document.getElementById("scanResult").innerText = `Success! Attendance marked for ${subject} ✅`;
                    loadStudentAttendance(); // Reload stats and table
                }

            } catch (err) {
                console.error(err);
                document.getElementById("scanResult").innerText = "Error parsing QR or connecting to backend.";
            }

            scanner.stop();
        },
        (error)=>{}
    ).catch(err => {
        document.getElementById("scanResult").innerText = "Camera access denied or device not found.";
    });
}

async function loadStudentAttendance(){
    if (!currentUser) return;

    const filter = document.getElementById("filterOption").value;
    const body = document.getElementById("attendanceBody");
    body.innerHTML = "<tr><td colspan='3'>Loading attendance data...</td></tr>";

    try {
        const response = await fetch(`/api/attendance/student?enrollment=${currentUser.enrollment}&status=${filter}`);
        const data = await response.json();

        if (!response.ok) {
            body.innerHTML = `<tr><td colspan='3' style='color:#ffcccc;'>Error: ${data.error || 'Failed to fetch'}</td></tr>`;
            return;
        }

        // Update dashboard stats
        document.getElementById("totalClasses").innerText = data.stats.totalClasses;
        document.getElementById("presentCount").innerText = data.stats.presentCount;
        document.getElementById("absentCount").innerText = data.stats.absentCount;
        document.getElementById("attendancePercent").innerText = data.stats.attendancePercent + "%";

        // Update table
        body.innerHTML = "";
        if (data.records.length === 0) {
            body.innerHTML = "<tr><td colspan='3'>No attendance records found.</td></tr>";
            return;
        }

        data.records.forEach(rec => {
            const rowDate = new Date(rec.date).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowDate}</td>
                <td>${rec.subject}</td>
                <td style="color: ${rec.status === 'present' ? '#00ffae' : '#ffcccc'};">
                    ${rec.status === 'present' ? '✅ Present' : '❌ Absent'}
                </td>
            `;
            body.appendChild(tr);
        });

    } catch (err) {
        console.error(err);
        body.innerHTML = "<tr><td colspan='3' style='color:#ffcccc;'>Network error connecting to MongoDB.</td></tr>";
    }
}

</script>

</body>
</html>
