<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard - QR Attendance</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#4e73df,#1cc88a);
color:white;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logout-btn{
padding:8px 18px;
border:none;
border-radius:25px;
background:white;
color:#4e73df;
font-weight:bold;
cursor:pointer;
}

/* CONTAINER */
.container{
padding:120px 40px 40px 40px;
}

/* QR SECTION */
.qr-section{
background:rgba(255,255,255,0.15);
padding:25px;
border-radius:15px;
margin-bottom:40px;
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
}

.qr-section input{
padding:10px;
border:none;
border-radius:8px;
width:250px;
max-width:100%;
margin-bottom:10px;
color: #333;
}

.qr-btn{
padding:10px 18px;
border:none;
border-radius:25px;
background:white;
color:#4e73df;
font-weight:bold;
cursor:pointer;
margin:5px;
}

#qrcode{
margin-top:20px;
display:flex;
justify-content:center;
background: white;
padding: 15px;
border-radius: 10px;
}

#qrcode img{
max-width:100%;
height:auto;
}

#timer{
font-size:18px;
margin-top:15px;
font-weight:bold;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:20px;
border-radius:15px;
text-align:center;
}

/* FILTER */
.filter-section{
display:flex;
flex-wrap:wrap;
justify-content:flex-end;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.filter-section select{
padding:8px;
border-radius:8px;
border:none;
color: #333;
}
 
/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:10px;
overflow:hidden;
}

th,td{
padding:12px;
text-align:center;
}

th{
background:rgba(255,255,255,0.2);
}

tr:nth-child(even){
background:rgba(255,255,255,0.1);
}

/* MOBILE */
@media(max-width:768px){
.navbar{
padding:15px 20px;
}

.container{
padding:110px 20px 30px 20px;
}

.filter-section{
justify-content:center;
}

th,td{
padding:8px;
font-size:14px;
}

.qr-btn{
width:100%;
max-width:250px;
}
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">👨‍🏫 QR Attendance - Teacher</div>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

<h2 id="welcomeText">Welcome, Teacher 👋</h2>
<p style="margin-bottom:30px;">Generate secure dynamic QR codes and filter class attendance records instantly.</p>

<!-- QR SECTION -->
<div class="qr-section">
<h3>Generate Attendance QR</h3>
<br>
<input type="text" id="subjectName" placeholder="Enter Subject Name">
<div>
<button class="qr-btn" onclick="generateQR()">Generate QR</button>
<button class="qr-btn" onclick="shareQR()">Share QR</button>
</div>
<div id="qrcode" style="display:none;"></div>
<div id="timer"></div>
</div>

<!-- CARDS -->
<div class="cards">
<div class="card">
<p>Total Submissions</p>
<h3 id="totalStudents">0</h3>
</div>

<div class="card">
<p>Present</p>
<h3 id="presentCount">0</h3>
</div>

<div class="card">
<p>Absent</p>
<h3 id="absentCount">0</h3>
</div>

<div class="card">
<p>Sessions</p>
<h3 id="sessionCount">0</h3>
</div>
</div>

<!-- FILTER -->
<div class="filter-section">
<label>Filter Period:</label>
<select id="periodFilter" onchange="loadTeacherAttendance()">
<option value="all">All</option>
<option value="today">Today</option>
<option value="yesterday">Yesterday</option>
<option value="week">This Week</option>
<option value="month">This Month</option>
<option value="year">This Year</option>
</select>

<label>Year:</label>
<select id="yearFilter" onchange="loadTeacherAttendance()">
<option value="all">All Years</option>
<option value="1">1st Year</option>
<option value="2">2nd Year</option>
<option value="3">3rd Year</option>
<option value="4">4th Year</option>
</select>
</div>

<!-- TABLE -->
<table>
<thead>
<tr>
<th>Date</th>
<th>Student Name</th>
<th>Enrollment No</th>
<th>Year</th>
<th>Status</th>
<th>Time</th>
</tr>
</thead>
<tbody id="attendanceBody">
<!-- Loaded from MongoDB -->
</tbody>
</table>

</div>

<script>

let qrData="";
let countdown;
let currentUser = null;

window.onload = function() {
    const rawUser = localStorage.getItem('currentUser');
    if (!rawUser) {
        alert("Unauthorized! Please login first.");
        window.location.href = "login.html";
        return;
    }
    currentUser = JSON.parse(rawUser);
    document.getElementById("welcomeText").innerText = `Welcome, ${currentUser.fullName} 👋`;

    loadTeacherAttendance();
};

function logout(){
    localStorage.removeItem('currentUser');
    window.location.href="Home.html";
}

function generateQR(){
    const subject = document.getElementById("subjectName").value.trim();

    if(subject===""){
        alert("Please enter subject name!");
        return;
    }

    const sessionID = Math.floor(Math.random() * 900000 + 100000);
    
    // Generate actual mark link for students
    // Format: origin/student-dashboard.html?subject=Maths&session=123456
    qrData = `${window.location.origin}/student-dashboard.html?subject=${encodeURIComponent(subject)}&session=${sessionID}`;

    const qrContainer = document.getElementById("qrcode");
    qrContainer.style.display = "flex";
    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: qrData,
        width: 200,
        height: 200
    });

    document.getElementById("timer").innerText = "QR successfully generated for students! ✅";
}

function shareQR(){
    if(qrData===""){
        alert("Generate QR first!");
        return;
    }

    navigator.clipboard.writeText(qrData);
    alert("QR Verification Link copied! Share with your students to scan/click.");

    startTimer();
}

function startTimer(){
    let timeLeft=90;
    document.getElementById("timer").innerText=`QR expires in ${timeLeft} sec`;

    clearInterval(countdown);
    countdown=setInterval(()=>{
        timeLeft--;
        document.getElementById("timer").innerText=`QR expires in ${timeLeft} sec`;

        if(timeLeft<=0){
            clearInterval(countdown);
            document.getElementById("qrcode").innerHTML="";
            document.getElementById("qrcode").style.display="none";
            document.getElementById("timer").innerText="QR Expired!";
            qrData="";
        }
    },1000);
}

async function loadTeacherAttendance(){
    const period = document.getElementById("periodFilter").value;
    const year = document.getElementById("yearFilter").value;
    const body = document.getElementById("attendanceBody");

    body.innerHTML = "<tr><td colspan='6'>Loading attendance from MongoDB...</td></tr>";

    try {
        const response = await fetch(`/api/attendance/teacher?period=${period}&year=${year}`);
        const data = await response.json();

        if (!response.ok) {
            body.innerHTML = `<tr><td colspan='6' style='color:#ffcccc;'>Error: ${data.error || 'Failed to fetch'}</td></tr>`;
            return;
        }

        // Update summaries
        document.getElementById("totalStudents").innerText = data.stats.totalStudents;
        document.getElementById("presentCount").innerText = data.stats.presentCount;
        document.getElementById("absentCount").innerText = data.stats.absentCount;
        document.getElementById("sessionCount").innerText = data.stats.sessionCount;

        // Populate rows
        body.innerHTML = "";
        if (data.records.length === 0) {
            body.innerHTML = "<tr><td colspan='6'>No attendance records found for this selection.</td></tr>";
            return;
        }

        data.records.forEach(rec => {
            const rowDate = new Date(rec.date).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowDate}</td>
                <td>${rec.studentName}</td>
                <td>${rec.enrollment}</td>
                <td>${rec.year}</td>
                <td style="color: ${rec.status === 'present' ? '#00ffae' : '#ffcccc'};">
                    ${rec.status === 'present' ? '✅ Present' : '❌ Absent'}
                </td>
                <td>${rec.time}</td>
            `;
            body.appendChild(tr);
        });

    } catch (err) {
        console.error(err);
        body.innerHTML = "<tr><td colspan='6' style='color:#ffcccc;'>Network error connecting to MongoDB.</td></tr>";
    }
}

</script>

</body>
</html>
