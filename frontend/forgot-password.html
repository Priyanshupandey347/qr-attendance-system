<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - QR Attendance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
}

.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    align-items:center;
    padding:15px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

.logo a{
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:120px;
}

.form-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:15px;
    width:100%;
    max-width:450px;
    color:white;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.form-box h2{
    text-align:center;
    margin-bottom:25px;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.row input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    color: #333;
}

.btn{
    padding:10px 16px;
    border:none;
    border-radius:25px;
    background:white;
    color:#4e73df;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    font-size:14px;
    margin-bottom:10px;
    text-align: center;
}

.success{
    color:#00ffae;
}

.error{
    color:#ffcccc;
}

.timer{
    font-size:13px;
    margin-bottom:15px;
    text-align: center;
}

.hidden{
    display:none;
}

.bottom-text{
    text-align:center;
    margin-top:15px;
}

.bottom-text a{
    color:#f6c23e;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">
        <a href="Home.html">🎓 QR Attendance</a>
    </div>
</div>

<div class="container">
<div class="form-box">

<h2>Forgot Password</h2>

<!-- EMAIL + SEND -->
<div class="row">
    <input type="email" id="email" placeholder="Enter Registered Email">
    <button class="btn" id="sendBtn" onclick="sendCode()">Send Code</button>
</div>

<div class="timer" id="timerText"></div>
<div class="message" id="msg"></div>

<!-- OTP + VERIFY -->
<div class="row hidden" id="otpRow">
    <input type="text" id="otp" placeholder="Enter Code">
    <button class="btn" onclick="verifyCode()">Verify</button>
</div>

<div class="bottom-text">
    <a href="login.html">Back to Login</a>
</div>

</div>
</div>

<script>

let generatedCode="";
let timeLeft=60;
let countdown;

async function sendCode(){
    const email=document.getElementById("email").value.trim();
    const regex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!regex.test(email)){
        showMessage("Enter valid email format ❌","error");
        return;
    }

    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage((data.error || "Failed to generate OTP") + " ❌", "error");
            return;
        }

        generatedCode = data.otp;
        alert("Demo Verification Code: " + generatedCode); // Demo help

        // Store email and OTP in localstorage so set-password page can read them
        localStorage.setItem('resetEmail', email);
        localStorage.setItem('resetOtp', generatedCode);

        document.getElementById("otpRow").classList.remove("hidden");
        showMessage("Code generated successfully! ✅","success");

        startTimer();
    } catch (err) {
        console.error(err);
        showMessage("Network error. Could not connect to server. ❌", "error");
    }
}

function startTimer(){
    const sendBtn=document.getElementById("sendBtn");
    const timerText=document.getElementById("timerText");

    sendBtn.disabled=true;
    timeLeft=60;

    clearInterval(countdown);
    countdown=setInterval(()=>{
        timeLeft--;
        timerText.innerText="Resend available in "+timeLeft+"s";

        if(timeLeft<=0){
            clearInterval(countdown);
            sendBtn.disabled=false;
            timerText.innerText="You can resend code now";
        }
    },1000);
}

async function verifyCode(){
    const email = document.getElementById("email").value.trim();
    const entered = document.getElementById("otp").value.trim();

    try {
        const response = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp: entered })
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage((data.error || "Invalid code") + " ❌", "error");
            return;
        }

        showMessage("Code Verified ✅ Redirecting...","success");
        setTimeout(()=>{
            window.location.href="set-password.html";
        },1000);
    } catch (err) {
        console.error(err);
        showMessage("Network error. Verification failed. ❌", "error");
    }
}

function showMessage(text,type){
    const msg=document.getElementById("msg");
    msg.innerText=text;
    msg.className="message "+type;
}

</script>

</body>
</html>
