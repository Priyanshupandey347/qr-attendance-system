<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password - QR Attendance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
}

/* SAME HEADER */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    align-items:center;
    padding:15px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

.logo a{
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:120px;
}

.form-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:15px;
    width:100%;
    max-width:420px;
    color:white;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.form-box h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    color: #333;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:white;
    color:#4e73df;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.message{
    font-size:14px;
    margin-bottom:10px;
    text-align: center;
}

.error{
    color:#ffcccc;
}

.success{
    color:#00ffae;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">
        <a href="Home.html">🎓 QR Attendance</a>
    </div>
</div>

<div class="container">
<div class="form-box">

<h2>Set New Password</h2>

<div class="message" id="msg"></div>

<div class="input-group">
    <input type="password" id="newPass" placeholder="Enter New Password">
</div>

<div class="input-group">
    <input type="password" id="confirmPass" placeholder="Confirm Password">
</div>

<button class="btn" onclick="updatePassword()">Update Password</button>

</div>
</div>


<script>

async function updatePassword(){
    const newPass = document.getElementById("newPass").value.trim();
    const confirmPass = document.getElementById("confirmPass").value.trim();
    const msg = document.getElementById("msg");

    msg.innerText="";
    msg.className="message";

    if(newPass === "" || confirmPass === ""){
        msg.innerText="Please fill all fields ❌";
        msg.classList.add("error");
        return;
    }

    // Password must contain letters + numbers
    const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

    if(!regex.test(newPass)){
        msg.innerText="Password must contain letters and numbers (min 6 characters) ❌";
        msg.classList.add("error");
        return;
    }

    if(newPass !== confirmPass){
        msg.innerText="Passwords do not match ❌";
        msg.classList.add("error");
        return;
    }

    // Retrieve cached verification details from localStorage
    const email = localStorage.getItem('resetEmail');
    const otp = localStorage.getItem('resetOtp');

    if (!email || !otp) {
        msg.innerText = "Session expired. Please request OTP again. ❌";
        msg.classList.add("error");
        return;
    }

    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, newPassword: newPass })
        });

        const data = await response.json();

        if (!response.ok) {
            msg.innerText = (data.error || "Reset failed") + " ❌";
            msg.classList.add("error");
            return;
        }

        msg.innerText="Password changed successfully ✅ Redirecting...";
        msg.classList.add("success");
        
        // Clean up
        localStorage.removeItem('resetEmail');
        localStorage.removeItem('resetOtp');

        setTimeout(()=>{
            window.location.href="login.html";
        },1500);

    } catch (err) {
        console.error(err);
        msg.innerText = "Network error resetting password. ❌";
        msg.classList.add("error");
    }
}

</script>

</body>
</html>
